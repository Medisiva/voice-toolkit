[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-toolkit"
version = "0.1.0"
description = "Modular STT/TTS library for building voice interfaces"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Medisiva"}
]
requires-python = ">=3.9"
keywords = ["voice", "speech", "stt", "tts", "whisper", "piper", "assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core dependencies (minimal)
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# STT providers
whisper = [
    "openai-whisper>=20231117",
    "sounddevice>=0.4.0",
]

# TTS providers
piper = [
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]
edge = [
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]

# All providers
all = [
    "openai-whisper>=20231117",
    "piper-tts>=1.2.0",
    "edge-tts>=6.1.0",
    "sounddevice>=0.4.0",
    "soundfile>=0.12.0",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Medisiva/voice-toolkit"
Repository = "https://github.com/Medisiva/voice-toolkit"
Issues = "https://github.com/Medisiva/voice-toolkit/issues"

[tool.setuptools.packages.find]
include = ["voice_toolkit*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
