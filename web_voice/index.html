<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Claude</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        h1 { color: #7c3aed; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; }

        #status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #252542;
        }
        #status.listening { background: #1e3a1e; }
        #status.processing { background: #3a3a1e; }
        #status.speaking { background: #1e2a3a; }
        #status.error { background: #3a1e1e; }

        #micButton {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: #7c3aed;
            color: white;
            font-size: 40px;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            transition: all 0.3s;
        }
        #micButton:hover { background: #6d28d9; transform: scale(1.05); }
        #micButton.listening {
            background: #22c55e;
            animation: pulse 1s infinite;
        }
        #micButton:disabled { background: #444; cursor: not-allowed; }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
        }

        .transcript-box {
            background: #252542;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            min-height: 60px;
        }
        .label { color: #888; font-size: 12px; margin-bottom: 5px; }

        #conversation {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            max-width: 85%;
        }
        .user {
            background: #7c3aed;
            margin-left: auto;
        }
        .assistant {
            background: #374151;
        }
        .message pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: inherit;
        }

        #settings {
            margin-top: 20px;
            padding: 15px;
            background: #252542;
            border-radius: 8px;
        }
        #settings input {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #1a1a2e;
            color: #eee;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>🎙️ Voice Claude</h1>
    <p class="subtitle">Speak to interact with Claude Code</p>

    <div id="status">Click the microphone and speak</div>

    <button id="micButton">🎤</button>

    <div class="transcript-box">
        <div class="label">You said:</div>
        <div id="transcript">-</div>
    </div>

    <div id="conversation"></div>

    <div id="settings">
        <div class="label">Working Directory:</div>
        <input type="text" id="cwd" value="/Users/medisiva/Desktop/mycoding/animation" />
    </div>

    <script>
        const micButton = document.getElementById('micButton');
        const statusDiv = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        const conversationDiv = document.getElementById('conversation');
        const cwdInput = document.getElementById('cwd');

        // Check for browser support
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            statusDiv.textContent = 'Speech recognition not supported. Use Chrome.';
            statusDiv.className = 'error';
            micButton.disabled = true;
        }

        let recognition = null;
        let isListening = false;

        function setStatus(text, className = '') {
            statusDiv.textContent = text;
            statusDiv.className = className;
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = `<pre>${text}</pre>`;
            conversationDiv.appendChild(div);
            conversationDiv.scrollTop = conversationDiv.scrollHeight;
        }

        async function sendToClaude(text) {
            setStatus('Sending to Claude...', 'processing');

            try {
                const response = await fetch('http://localhost:8096/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        cwd: cwdInput.value
                    })
                });

                if (!response.ok) throw new Error('Server error');

                const data = await response.json();
                return data.response;
            } catch (e) {
                console.error(e);
                return `Error: Could not connect to server. Make sure the server is running:\n\npython web_voice/server.py`;
            }
        }

        async function speak(text) {
            return new Promise((resolve) => {
                // Truncate for speech
                const toSpeak = text.length > 500 ? text.slice(0, 500) + '... check the screen for more.' : text;

                const utterance = new SpeechSynthesisUtterance(toSpeak);
                utterance.rate = 1.0;
                utterance.onend = resolve;
                utterance.onerror = resolve;

                setStatus('Speaking...', 'speaking');
                speechSynthesis.speak(utterance);
            });
        }

        function startListening() {
            if (isListening) return;

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micButton.classList.add('listening');
                setStatus('Listening... speak now', 'listening');
            };

            recognition.onresult = (event) => {
                const result = event.results[event.results.length - 1];
                const transcript = result[0].transcript;
                transcriptDiv.textContent = transcript;

                if (result.isFinal) {
                    handleFinalTranscript(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                setStatus(`Error: ${event.error}`, 'error');
                stopListening();
            };

            recognition.onend = () => {
                stopListening();
            };

            recognition.start();
        }

        function stopListening() {
            isListening = false;
            micButton.classList.remove('listening');
            if (recognition) {
                recognition.stop();
            }
        }

        async function handleFinalTranscript(text) {
            if (!text.trim()) return;

            stopListening();
            addMessage(text, 'user');

            // Send to Claude
            const response = await sendToClaude(text);
            addMessage(response, 'assistant');

            // Speak response
            await speak(response);

            setStatus('Click the microphone to speak again');
        }

        micButton.addEventListener('click', () => {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        });

        // Keyboard shortcut: Space to toggle
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                micButton.click();
            }
        });
    </script>
</body>
</html>
